<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="dark" />
    <style>
      :root {
        --ink: rgba(255, 255, 255, 0.94);
        --ink-soft: rgba(255, 255, 255, 0.62);
        --ink-faint: rgba(255, 255, 255, 0.4);
        --line: rgba(255, 255, 255, 0.12);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100%;
        background: transparent;
        color: var(--ink);
        font-family: -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN",
          sans-serif;
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
      }

      .card {
        height: 100%;
        display: flex;
        flex-direction: column;
        padding: 16px 18px 18px;
        border-radius: 20px;
        background: linear-gradient(
          180deg,
          rgba(22, 26, 34, 0.9) 0%,
          rgba(10, 12, 18, 0.86) 100%
        );
        box-shadow: inset 0 0.5px 0 rgba(255, 255, 255, 0.2);
      }

      .titlebar {
        display: flex;
        align-items: center;
        gap: 10px;
        cursor: grab;
        margin-bottom: 12px;
        user-select: none;
        -webkit-user-select: none;
      }

      .title {
        font-size: 17px;
        font-weight: 650;
        letter-spacing: -0.02em;
      }

      .spacer {
        flex: 1;
      }

      .summarize,
      .close {
        border: 0;
        cursor: pointer;
      }

      .summarize {
        height: 26px;
        padding: 0 12px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.14);
        color: var(--ink);
        font: inherit;
        font-size: 12px;
        font-weight: 600;
      }

      .summarize:disabled {
        opacity: 0.45;
        cursor: default;
      }

      .close {
        width: 22px;
        height: 22px;
        background: transparent;
        color: var(--ink-faint);
        font-size: 18px;
        line-height: 1;
        border-radius: 6px;
      }

      .close:hover {
        color: var(--ink);
        background: rgba(255, 255, 255, 0.08);
      }

      .body {
        flex: 1;
        min-height: 0;
        overflow: auto;
      }

      .status {
        font-size: 12px;
        color: var(--ink-faint);
        margin-bottom: 10px;
      }

      .line {
        color: var(--ink-soft);
        font-size: 13px;
        line-height: 1.45;
        margin-bottom: 6px;
      }

      .overview {
        font-size: 15px;
        line-height: 1.55;
        margin-bottom: 14px;
      }

      section {
        margin-top: 12px;
        padding-top: 10px;
        border-top: 1px solid var(--line);
      }

      section.hidden,
      #summary.hidden {
        display: none;
      }

      h2 {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.04em;
        color: var(--ink-faint);
        margin-bottom: 8px;
      }

      .item {
        margin-bottom: 10px;
      }

      .ja {
        font-size: 14.5px;
        line-height: 1.5;
      }

      .en {
        margin-top: 2px;
        font-size: 12px;
        line-height: 1.4;
        color: var(--ink-soft);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <header class="titlebar" id="titlebar">
        <div class="title">会議メモ</div>
        <div class="spacer"></div>
        <button class="summarize" id="summarize" type="button" disabled>要約する</button>
        <button class="close" id="close" type="button" aria-label="閉じる">×</button>
      </header>
      <div class="body">
        <div class="status" id="status">まだ発話がありません</div>
        <div id="summary" class="hidden">
          <div class="overview" id="overview"></div>
          <section id="topics-section" class="hidden">
            <h2>議題</h2>
            <div id="topics"></div>
          </section>
          <section id="decisions-section" class="hidden">
            <h2>決定</h2>
            <div id="decisions"></div>
          </section>
          <section id="actions-section" class="hidden">
            <h2>次のアクション</h2>
            <div id="actions"></div>
          </section>
        </div>
        <div id="lines"></div>
      </div>
    </div>
    <script>
      var summarize = document.getElementById("summarize");

      document.getElementById("close").addEventListener("click", function () {
        window.ipc.postMessage("close");
      });

      document.getElementById("titlebar").addEventListener("mousedown", function (event) {
        if (event.button !== 0 || event.target.closest("button")) {
          return;
        }
        window.ipc.postMessage("drag");
      });

      summarize.addEventListener("click", function () {
        summarize.dataset.busy = "1";
        summarize.disabled = true;
        summarize.textContent = "要約しています…";
        window.ipc.postMessage("summarize");
      });

      function renderLines(lines) {
        var count = (lines || []).length;
        var status = document.getElementById("status");
        var list = document.getElementById("lines");
        list.replaceChildren();
        if (count === 0) {
          status.textContent = "まだ発話がありません";
          summarize.disabled = true;
          return;
        }
        status.textContent = count + "件を収録";
        if (!summarize.dataset.busy) {
          summarize.disabled = false;
        }
        lines.slice(-8).forEach(function (line) {
          var row = document.createElement("div");
          row.className = "line";
          row.textContent = line;
          list.append(row);
        });
      }

      function fill(name, items) {
        var list = document.getElementById(name);
        var section = document.getElementById(name + "-section");
        list.replaceChildren();
        var visible = (items || []).filter(function (item) {
          return item && (item.japanese || item.english);
        });
        section.classList.toggle("hidden", visible.length === 0);
        visible.forEach(function (item) {
          var row = document.createElement("div");
          row.className = "item";
          var ja = document.createElement("div");
          ja.className = "ja";
          ja.textContent = item.japanese || "";
          var en = document.createElement("div");
          en.className = "en";
          en.textContent = item.english || "";
          row.append(ja, en);
          list.append(row);
        });
        return visible.length;
      }

      window.konnnyakuUpdate = function (payload) {
        if (!payload || payload.kind === "hearing") {
          renderLines((payload && payload.lines) || []);
          return;
        }
        delete summarize.dataset.busy;
        summarize.textContent = "要約する";
        renderLines(payload.lines || []);
        document.getElementById("overview").textContent = payload.overview || "";
        var count =
          fill("topics", payload.topics) +
          fill("decisions", payload.decisions) +
          fill("actions", payload.actions);
        document.getElementById("summary").classList.toggle("hidden", count === 0 && !payload.overview);
        if (payload.error) {
          document.getElementById("status").textContent = payload.error;
        } else if (count === 0) {
          document.getElementById("status").textContent = "まだ要約できる長さではありません";
        }
      };
    </script>
  </body>
</html>
