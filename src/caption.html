<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="dark" />
    <style>
      :root {
        --ink: rgba(255, 255, 255, 0.94);
        --ink-soft: rgba(255, 255, 255, 0.62);
        --ink-faint: rgba(255, 255, 255, 0.42);
        --pill: rgba(255, 255, 255, 0.1);
        --pill-ink: rgba(255, 255, 255, 0.78);
        --col-gap: 28px;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100%;
        background: transparent;
        color: var(--ink);
        font-family: -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN",
          sans-serif;
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
      }

      .card {
        height: 100%;
        display: flex;
        flex-direction: column;
        padding: 16px 18px 18px;
        border-radius: 20px;
        background: linear-gradient(
          180deg,
          rgba(22, 26, 34, 0.9) 0%,
          rgba(10, 12, 18, 0.86) 100%
        );
        box-shadow: inset 0 0.5px 0 rgba(255, 255, 255, 0.2);
      }

      .titlebar {
        display: flex;
        align-items: center;
        gap: 12px;
        cursor: grab;
        margin-bottom: 14px;
        user-select: none;
        -webkit-user-select: none;
      }

      .title {
        font-size: 17px;
        font-weight: 650;
        letter-spacing: -0.02em;
      }

      .spacer {
        flex: 1;
      }

      .langs {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      .langs select {
        height: 26px;
        border: 0;
        border-radius: 8px;
        background: var(--pill);
        color: var(--pill-ink);
        font: inherit;
        font-size: 12.5px;
        padding: 0 6px;
      }

      .langs .lang-label {
        color: var(--ink-faint);
        font-size: 12px;
        font-weight: 600;
      }

      .hear {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      .hear-btn {
        height: 26px;
        border: 0;
        border-radius: 8px;
        padding: 0 8px;
        background: var(--pill);
        color: var(--ink-faint);
        font: inherit;
        font-size: 12.5px;
        font-weight: 600;
        cursor: pointer;
        user-select: none;
        -webkit-user-select: none;
      }

      .hear-btn[aria-pressed="true"] {
        background: rgba(255, 255, 255, 0.22);
        color: var(--ink);
      }

      .note {
        color: var(--ink-faint);
        font-size: 12.5px;
        line-height: 1.4;
        margin: -6px 0 8px;
      }

      .clear,
      .close,
      .copy {
        border: 0;
        cursor: pointer;
      }

      .clear,
      .copy {
        height: 26px;
        padding: 0 12px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.14);
        color: var(--ink);
        font: inherit;
        font-size: 12px;
        font-weight: 600;
      }

      .copy {
        height: 22px;
        padding: 0 10px;
        justify-self: start;
        background: var(--pill);
        color: var(--pill-ink);
        font-size: 11.5px;
        user-select: none;
        -webkit-user-select: none;
      }

      .clear:disabled,
      .copy:disabled {
        opacity: 0.45;
        cursor: default;
      }

      .close {
        width: 22px;
        height: 22px;
        background: transparent;
        color: var(--ink-faint);
        font-size: 18px;
        line-height: 1;
        border-radius: 6px;
      }

      .close:hover {
        color: var(--ink);
        background: rgba(255, 255, 255, 0.08);
      }

      .copies,
      .columns {
        display: grid;
        grid-template-columns: 1fr 1fr;
        column-gap: var(--col-gap);
        align-items: start;
      }

      .copies {
        margin: 0 0 8px;
      }

      body.single .copies,
      body.single .columns {
        grid-template-columns: 1fr;
      }

      body.single .copy-target,
      body.single .lane-target {
        display: none;
      }

      .log {
        flex: 1;
        min-height: 0;
        overflow-x: hidden;
        overflow-y: auto;
      }

      .placeholder {
        color: var(--ink-faint);
        font-size: 15px;
        line-height: 1.55;
      }

      .lane {
        min-width: 0;
      }

      .cell {
        min-width: 0;
        font-size: 15px;
        line-height: 1.55;
        letter-spacing: -0.011em;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        padding: 2px 0 8px;
      }

      body:not(.single) .cell.source {
        color: var(--ink-soft);
      }

      body:not(.single) .cell.source.span {
        width: calc(200% + var(--col-gap));
        color: var(--ink);
      }

      body:not(.single) .cell.target.span {
        visibility: hidden;
        pointer-events: none;
      }

      .stack .cell:empty {
        display: none;
        padding: 0;
      }

      .cell.preview {
        opacity: 0.72;
      }

      .who {
        display: inline-block;
        margin-right: 6px;
        padding: 0 6px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.14);
        color: var(--ink);
        font-size: 11px;
        font-weight: 650;
        line-height: 1.45;
        vertical-align: 1px;
        user-select: none;
        -webkit-user-select: none;
      }

      .who.s0 { background: rgba(224, 164, 74, 0.38); }
      .who.s1 { background: rgba(92, 156, 214, 0.4); }
      .who.s2 { background: rgba(94, 176, 140, 0.4); }
      .who.s3 { background: rgba(196, 112, 138, 0.4); }
      .who.s4 { background: rgba(150, 132, 204, 0.42); }
      .who.s5 { background: rgba(176, 176, 176, 0.28); }
    </style>
  </head>
  <body>
    <div class="card">
      <header class="titlebar" id="titlebar">
        <div class="title">文字起こし</div>
        <div class="hear">
          <button class="hear-btn" id="hear-input" type="button" aria-pressed="true">入力</button>
          <button class="hear-btn" id="hear-output" type="button" aria-pressed="false">出力</button>
        </div>
        <div class="spacer"></div>
        <div class="langs">
          <span class="lang-label">表示</span>
          <select id="primary" aria-label="表示言語">
            <option value="ja" selected>日本語</option>
            <option value="en">英語</option>
          </select>
        </div>
        <button class="clear" id="clear" type="button" disabled>クリア</button>
        <button class="close" id="close" type="button" aria-label="閉じる">×</button>
      </header>
      <div class="note" id="note" hidden></div>
      <div class="note" id="hear-note" hidden></div>
      <div class="copies" id="copies" hidden>
        <button class="copy" id="copy-source" type="button" disabled>英語をコピー</button>
        <button class="copy copy-target" id="copy-target" type="button" disabled>日本語をコピー</button>
      </div>
      <div class="log" id="log">
        <div class="placeholder" id="placeholder">聞き取り中…</div>
        <div class="columns" id="columns">
          <div class="lane lane-source" id="lane-source"></div>
          <div class="lane lane-target" id="lane-target"></div>
        </div>
      </div>
    </div>
    <script>
      var log = document.getElementById("log");
      var columns = document.getElementById("columns");
      var copies = document.getElementById("copies");
      var placeholder = document.getElementById("placeholder");
      var clearButton = document.getElementById("clear");
      var copySource = document.getElementById("copy-source");
      var copyTarget = document.getElementById("copy-target");
      var laneSource = document.getElementById("lane-source");
      var laneTarget = document.getElementById("lane-target");
      var follow = true;
      var settled = Object.create(null);
      var rows = Object.create(null);
      var dragLane = null;
      var adjusting = false;

      function nearBottom() {
        return log.scrollHeight - log.scrollTop - log.clientHeight < 48;
      }

      function stickToBottom() {
        if (follow || nearBottom()) {
          log.scrollTop = log.scrollHeight;
        }
      }

      function refreshChrome() {
        var hasRow = Object.keys(rows).length > 0;
        placeholder.hidden = hasRow;
        copies.hidden = !hasRow;
        clearButton.disabled = !hasRow;
        updateCopyButtons();
      }

      log.addEventListener("scroll", function () {
        follow = nearBottom();
      });

      function post(message) {
        if (!window.ipc || !window.ipc.postMessage) {
          return false;
        }
        window.ipc.postMessage(message);
        return true;
      }

      document.getElementById("close").addEventListener("click", function () {
        post("close");
      });

      clearButton.addEventListener("click", function () {
        post("clear");
        Object.keys(rows).forEach(function (key) {
          settled[key] = true;
          var row = rows[key];
          row.source.remove();
          row.target.remove();
          row.stack.remove();
          delete rows[key];
        });
        follow = true;
        refreshChrome();
      });

      document.getElementById("titlebar").addEventListener("mousedown", function (event) {
        if (event.button !== 0 || event.target.closest("button, select")) {
          return;
        }
        post("drag");
      });

      var primaryLang = document.getElementById("primary");
      var note = document.getElementById("note");
      var hearInput = document.getElementById("hear-input");
      var hearOutput = document.getElementById("hear-output");
      var hearNote = document.getElementById("hear-note");
      var hearError = "";

      function hearOn(button) {
        return button.getAttribute("aria-pressed") === "true";
      }

      function refreshHearNote() {
        var input = hearOn(hearInput);
        var output = hearOn(hearOutput);
        var text = hearError;
        if (!text) {
          if (!input && !output) {
            text = "入力も出力もオフです。";
          } else if (input && output) {
            text = "スピーカーだと、出力の音がマイクにも入ります。";
          }
        }
        hearNote.hidden = !text;
        hearNote.textContent = text || "";
      }

      function toggleHear(button, kind) {
        var on = !hearOn(button);
        button.setAttribute("aria-pressed", on ? "true" : "false");
        hearError = "";
        post("hear:" + kind + ":" + (on ? "1" : "0"));
        refreshHearNote();
      }

      hearInput.addEventListener("click", function () {
        toggleHear(hearInput, "in");
      });
      hearOutput.addEventListener("click", function () {
        toggleHear(hearOutput, "out");
      });

      window.konnnyakuHear = function (input, output, message) {
        hearInput.setAttribute("aria-pressed", input ? "true" : "false");
        hearOutput.setAttribute("aria-pressed", output ? "true" : "false");
        hearError = message || "";
        refreshHearNote();
      };

      function anyTranslated() {
        var keys = Object.keys(rows);
        for (var i = 0; i < keys.length; i++) {
          if (!rows[keys[i]].single) {
            return true;
          }
        }
        return false;
      }

      function rowsInOrder() {
        return Object.keys(rows)
          .sort(function (a, b) {
            return Number(a) - Number(b);
          })
          .map(function (key) {
            return rows[key];
          });
      }

      function cellText(node) {
        return node.textContent.replace(/^\s+|\s+$/g, "");
      }

      function originalCopy() {
        var parts = [];
        var list = rowsInOrder();
        for (var i = 0; i < list.length; i++) {
          var text = cellText(list[i].source);
          if (text) {
            parts.push(text);
          }
        }
        return parts.join("\n");
      }

      function displayCopy() {
        var parts = [];
        var list = rowsInOrder();
        for (var i = 0; i < list.length; i++) {
          var node = list[i].single ? list[i].source : list[i].target;
          var text = cellText(node);
          if (text) {
            parts.push(text);
          }
        }
        return parts.join("\n");
      }

      function updateCopyButtons() {
        var mixed = anyTranslated();
        document.body.classList.toggle("single", !mixed);
        if (!mixed) {
          copySource.dataset.label = "コピー";
        } else {
          copySource.dataset.label = "原文をコピー";
          copyTarget.dataset.label = "訳をコピー";
        }
        if (copySource.dataset.busy !== "1") {
          copySource.textContent = copySource.dataset.label;
        }
        if (copyTarget.dataset.busy !== "1") {
          copyTarget.textContent = copyTarget.dataset.label;
        }
        copySource.setAttribute("aria-label", copySource.dataset.label);
        copyTarget.setAttribute("aria-label", copyTarget.dataset.label);
        copySource.disabled = !originalCopy();
        copyTarget.disabled = !mixed || !displayCopy();
      }

      function bindCopy(button, read) {
        var timer = 0;
        button.addEventListener("click", function () {
          var text = read();
          if (!text || !post("copy:" + text)) {
            return;
          }
          button.dataset.busy = "1";
          button.textContent = "コピーしました";
          clearTimeout(timer);
          timer = setTimeout(function () {
            button.dataset.busy = "";
            button.textContent = button.dataset.label || "";
          }, 1200);
        });
      }

      bindCopy(copySource, originalCopy);
      bindCopy(copyTarget, displayCopy);

      function applyLayout() {
        document.body.classList.toggle("single", !anyTranslated());
        dragLane = null;
        var keys = Object.keys(rows);
        for (var i = 0; i < keys.length; i++) {
          mount(rows[keys[i]]);
        }
        if (anyTranslated()) {
          alignAll();
        }
        refreshChrome();
      }

      function publishPrimary() {
        post("primary:" + primaryLang.value);
      }

      primaryLang.addEventListener("change", publishPrimary);

      window.konnnyakuPrimary = function (lang) {
        if (lang === "en" || lang === "ja") {
          primaryLang.value = lang;
        }
      };

      function has(pair, key) {
        return Object.prototype.hasOwnProperty.call(pair, key);
      }

      function makeCell(rev, role) {
        var cell = document.createElement("div");
        cell.className = "cell " + role;
        cell.dataset.rev = rev;
        cell.dataset.role = role;
        return cell;
      }

      function makeRow(rev) {
        var stack = document.createElement("div");
        stack.className = "stack";
        stack.dataset.rev = rev;
        return {
          rev: rev,
          source: makeCell(rev, "source"),
          target: makeCell(rev, "target"),
          stack: stack,
          live: true,
          refined: false,
          single: true,
        };
      }

      function insertNode(lane, node) {
        var rev = Number(node.dataset.rev);
        var next = null;
        var nodes = lane.children;
        for (var i = 0; i < nodes.length; i++) {
          if (nodes[i] === node) {
            continue;
          }
          if (Number(nodes[i].dataset.rev) > rev) {
            next = nodes[i];
            break;
          }
        }
        if (node.parentNode === lane && node.nextSibling === next) {
          return;
        }
        if (next) {
          lane.insertBefore(node, next);
          return;
        }
        if (node.parentNode !== lane || node.nextSibling) {
          lane.appendChild(node);
        }
      }

      function mount(row) {
        row.source.classList.toggle("preview", row.live);
        row.target.classList.toggle("preview", row.live);
        row.source.style.height = "";
        row.target.style.height = "";
        var mixed = anyTranslated();
        var span = mixed && row.single;
        row.source.classList.toggle("span", span);
        row.target.classList.toggle("span", span);
        if (!mixed) {
          row.target.hidden = true;
          if (row.source.parentNode !== row.stack) {
            row.stack.insertBefore(row.source, row.stack.firstChild);
          }
          if (row.target.parentNode !== row.stack) {
            row.stack.appendChild(row.target);
          }
          insertNode(laneSource, row.stack);
          return;
        }
        row.target.hidden = false;
        insertNode(laneSource, row.source);
        insertNode(laneTarget, row.target);
        if (row.stack.parentNode) {
          row.stack.remove();
        }
      }

      function alignAll() {
        if (!anyTranslated()) {
          return;
        }
        var keys = Object.keys(rows);
        var list = [];
        var i;
        for (i = 0; i < keys.length; i++) {
          var row = rows[keys[i]];
          if (row.source.parentNode !== laneSource || row.target.parentNode !== laneTarget) {
            continue;
          }
          row.source.style.height = "auto";
          row.target.style.height = "auto";
          list.push(row);
        }
        var heights = [];
        for (i = 0; i < list.length; i++) {
          heights.push(
            Math.max(
              list[i].source.getBoundingClientRect().height,
              list[i].target.getBoundingClientRect().height
            )
          );
        }
        for (i = 0; i < list.length; i++) {
          var px = Math.ceil(heights[i]) + "px";
          list[i].source.style.height = px;
          list[i].target.style.height = px;
        }
      }

      window.addEventListener("resize", alignAll);

      function fillTurns(cell, turns, field) {
        cell.replaceChildren();
        var wrote = false;
        for (var i = 0; i < turns.length; i++) {
          var value = turns[i][field];
          if (value === undefined || value === null || String(value) === "") {
            continue;
          }
          if (wrote) {
            cell.appendChild(document.createTextNode("\n"));
          }
          var speaker = Number(turns[i].speaker) || 0;
          if (speaker > 0) {
            var who = document.createElement("span");
            who.className = "who s" + ((speaker - 1) % 6);
            who.textContent = "話者 " + speaker + " ";
            cell.appendChild(who);
          }
          cell.appendChild(document.createTextNode(String(value)));
          wrote = true;
        }
      }

      function paint(row, pair, live) {
        row.live = live;
        if (has(pair, "single")) {
          row.single = !!pair.single;
        }
        if (has(pair, "turns") && Array.isArray(pair.turns)) {
          fillTurns(row.source, pair.turns, "source");
          if (pair.single) {
            row.target.textContent = "";
          } else {
            fillTurns(row.target, pair.turns, "target");
          }
        } else if (has(pair, "text")) {
          row.source.textContent = pair.text || "";
          row.target.textContent = "";
        } else {
          if (has(pair, "source")) {
            row.source.textContent = pair.source || "";
          } else if (has(pair, "english")) {
            row.source.textContent = pair.english || "";
          }
          if (has(pair, "target")) {
            row.target.textContent = pair.target || "";
          } else if (has(pair, "japanese")) {
            row.target.textContent = pair.japanese || "";
          }
        }
        applyLayout();
      }

      function elementOf(node) {
        if (!node) {
          return null;
        }
        return node.nodeType === 1 ? node : node.parentElement;
      }

      function laneOf(node) {
        var el = elementOf(node);
        return el && el.closest(".lane");
      }

      function revOf(node) {
        var el = elementOf(node);
        var host = el && el.closest("[data-rev]");
        return host ? host.dataset.rev : "";
      }

      function clampTo(lane) {
        if (adjusting || !lane || !anyTranslated()) {
          return;
        }
        var sel = document.getSelection();
        if (!sel || sel.rangeCount === 0 || sel.isCollapsed) {
          return;
        }
        var anchorLane = laneOf(sel.anchorNode);
        var focusLane = laneOf(sel.focusNode);
        if (anchorLane === lane && focusLane === lane) {
          return;
        }
        var focusRev = revOf(sel.focusNode);
        var anchorRev = revOf(sel.anchorNode);
        if (!focusRev || !anchorRev || !rows[focusRev] || !rows[anchorRev]) {
          return;
        }
        var mapped = lane === laneSource ? rows[focusRev].source : rows[focusRev].target;
        var anchorNode = anchorLane === lane ? sel.anchorNode : rows[anchorRev].source;
        var anchorOffset = anchorLane === lane ? sel.anchorOffset : 0;
        if (lane === laneTarget && anchorLane !== lane) {
          anchorNode = rows[anchorRev].target;
        }
        var range = document.createRange();
        try {
          if (focusRev === anchorRev) {
            if (lane === laneTarget) {
              range.setStart(mapped, 0);
              range.setEnd(anchorNode, anchorOffset);
            } else {
              range.setStart(anchorNode, anchorOffset);
              range.setEnd(mapped, mapped.childNodes.length);
            }
          } else if (Number(focusRev) > Number(anchorRev)) {
            range.setStart(anchorNode, anchorOffset);
            range.setEnd(mapped, mapped.childNodes.length);
          } else {
            range.setStart(mapped, 0);
            range.setEnd(anchorNode, anchorOffset);
          }
        } catch (err) {
          return;
        }
        if (range.collapsed) {
          return;
        }
        adjusting = true;
        sel.removeAllRanges();
        sel.addRange(range);
        adjusting = false;
      }

      function endColumnDrag() {
        var lane = dragLane;
        if (!lane) {
          return;
        }
        clampTo(lane);
        setTimeout(function () {
          if (dragLane !== lane) {
            return;
          }
          clampTo(lane);
          dragLane = null;
        }, 0);
      }

      log.addEventListener(
        "pointerdown",
        function (event) {
          if (event.button !== 0) {
            return;
          }
          dragLane = event.target.closest(".lane");
        },
        true
      );
      window.addEventListener("pointerup", endColumnDrag);
      window.addEventListener("pointercancel", function () {
        dragLane = null;
      });
      window.addEventListener("blur", function () {
        dragLane = null;
      });

      document.addEventListener("selectionchange", function () {
        if (dragLane) {
          clampTo(dragLane);
        }
      });

      function rowFor(rev) {
        var key = String(rev);
        if (rows[key]) {
          return rows[key];
        }
        var row = makeRow(key);
        rows[key] = row;
        return row;
      }

      window.konnnyakuUpdate = function (pair) {
        if (!pair) {
          return;
        }
        if (pair.kind === "status") {
          note.hidden = !pair.message;
          note.textContent = pair.message || "";
          return;
        }
        if (pair.kind === "hear") {
          window.konnnyakuHear(!!pair.input, !!pair.output, pair.message || "");
          return;
        }
        if (pair.rev === undefined || pair.rev === null) {
          return;
        }
        var rev = String(pair.rev);
        if (pair.kind === "drop") {
          settled[rev] = true;
          var dropped = rows[rev];
          if (dropped && dropped.live) {
            dropped.source.remove();
            dropped.target.remove();
            dropped.stack.remove();
            delete rows[rev];
          }
          applyLayout();
          stickToBottom();
          return;
        }
        if (settled[rev]) {
          return;
        }
        var row = rowFor(rev);
        if (pair.rough && row.refined) {
          return;
        }
        if (!pair.rough && pair.kind !== "commit") {
          row.refined = true;
        }
        if (pair.kind === "commit") {
          settled[rev] = true;
          paint(row, pair, false);
        } else {
          paint(row, pair, true);
        }
        refreshChrome();
        stickToBottom();
      };
    </script>
  </body>
</html>
