[package]
name = "konnnyaku"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Fully local English speech to Japanese subtitle PoC"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
cpal = "0.16"
crossbeam-channel = "0.5"
ctrlc = "3.4"
hound = "3"
sherpa-onnx = "1.13.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hdrhistogram = "7"
ort = "=2.0.0-rc.14"
tokenizers = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
